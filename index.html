<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>五子棋 · 远程人人对战</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #2a6b5e 0%, #1d4a41 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #deb887;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-radius: 8px;
            cursor: pointer;
            background-color: #f7e9c3;
        }
        .info-panel {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .turn-indicator {
            background: #5a3e2b;
            padding: 8px 20px;
            border-radius: 60px;
            color: #f0e2b6;
            font-weight: bold;
            font-size: 1rem;
        }
        button {
            background: #ffc107;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b16e1a;
        }
        button:active { transform: translateY(2px); }
        .room-info {
            background: #4a3624;
            color: #ffecb3;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.9rem;
            word-break: break-all;
        }
        a { color: #ffd966; }
        @media (max-width: 600px) {
            .turn-indicator { font-size: 0.8rem; padding: 5px 12px; }
            .room-info { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gobangCanvas" width="560" height="560"></canvas>
    <div class="info-panel">
        <div class="turn-indicator" id="turnLabel">连接中...</div>
        <button id="resetBtn">↺ 新一局</button>
        <div class="room-info" id="roomInfo"></div>
    </div>
    <div id="statusMsg" style="margin-top: 12px; font-size: 0.9rem; color: #2c2e1f;"></div>
</div>

<script>
    // ========== Firebase 配置 ==========
    const firebaseConfig = {
        apiKey: "AIzaSyAjSi2qMgewlHGPTCnb4x6iciIf9X8r6IA",
        authDomain: "gobang-87cd8.firebaseapp.com",
        projectId: "gobang-87cd8",
        storageBucket: "gobang-87cd8.firebasestorage.app",
        messagingSenderId: "435120401564",
        appId: "1:435120401564:web:faff4f07cfd580c7de9159",
        measurementId: "G-DJ13R8DFG0"
    };
    // =====================================

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 游戏参数
    const boardSize = 15;
    const canvas = document.getElementById('gobangCanvas');
    const ctx = canvas.getContext('2d');
    const cellSize = 560 / boardSize;

    let board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
    let currentTurn = 1;      // 1:黑棋(先手), 2:白棋
    let myColor = null;        // 1:黑, 2:白
    let gameOver = false;
    let winner = null;
    let roomId = null;
    let roomRef = null;

    let myPlayerId = null;     // 唯一标识
    let playerRef = null;      // 自己的占位节点

    const turnLabel = document.getElementById('turnLabel');
    const resetBtn = document.getElementById('resetBtn');
    const roomInfoDiv = document.getElementById('roomInfo');
    const statusMsgDiv = document.getElementById('statusMsg');

    // ----- 绘图（同前，略）-----
    function drawBoard() {
        ctx.fillStyle = '#e3bc8e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#2b2b2b';
        for (let i = 0; i < boardSize; i++) {
            const pos = i * cellSize;
            ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(canvas.width, pos); ctx.stroke();
        }
        const starPoints = [[3,3],[11,3],[7,7],[3,11],[11,11]];
        for(let [x,y] of starPoints) {
            ctx.beginPath();
            ctx.arc(x*cellSize, y*cellSize, cellSize*0.12, 0, 2*Math.PI);
            ctx.fillStyle = '#5e3a1f'; ctx.fill();
            ctx.beginPath();
            ctx.arc(x*cellSize, y*cellSize, cellSize*0.08, 0, 2*Math.PI);
            ctx.fillStyle = '#f7d99e'; ctx.fill();
        }
    }
    function drawPiece(row, col) {
        const val = board[row][col];
        if(val === 0) return;
        const cx = col * cellSize, cy = row * cellSize;
        const radius = cellSize * 0.4;
        ctx.shadowBlur = 3; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.shadowColor = "rgba(0,0,0,0.4)";
        const gradient = ctx.createRadialGradient(cx-5, cy-5, 5, cx, cy, radius);
        if(val === 1) { gradient.addColorStop(0, '#2b2b2b'); gradient.addColorStop(1, '#111'); }
        else { gradient.addColorStop(0, '#f9f9fc'); gradient.addColorStop(1, '#c0c0c5'); }
        ctx.fillStyle = gradient;
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#444'; ctx.lineWidth = 0.8; ctx.stroke();
    }
    function redrawAll() {
        drawBoard();
        for(let i=0; i<boardSize; i++)
            for(let j=0; j<boardSize; j++)
                if(board[i][j] !== 0) drawPiece(i, j);
    }

    // 胜负判定
    function checkWin(row, col, playerVal) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for(let [dx,dy] of dirs) {
            let cnt = 1;
            for(let step=1; step<=5; step++) {
                const nr = row+dx*step, nc = col+dy*step;
                if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                if(board[nr][nc] === playerVal) cnt++; else break;
            }
            for(let step=1; step<=5; step++) {
                const nr = row-dx*step, nc = col-dy*step;
                if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                if(board[nr][nc] === playerVal) cnt++; else break;
            }
            if(cnt >= 5) return true;
        }
        return false;
    }
    function isFull() {
        for(let i=0;i<boardSize;i++) for(let j=0;j<boardSize;j++) if(board[i][j]===0) return false;
        return true;
    }

    function updateUI() {
        if(gameOver) {
            if(winner === 1) turnLabel.innerText = "🏆 黑棋胜利！ 🏆";
            else if(winner === 2) turnLabel.innerText = "🏆 白棋胜利！ 🏆";
            else turnLabel.innerText = "🤝 平局";
            return;
        }
        if(myColor === null) {
            turnLabel.innerText = "等待对手加入...";
            return;
        }
        if(currentTurn === myColor) {
            turnLabel.innerText = (myColor === 1 ? "⚫ 你的回合 (黑棋)" : "⚪ 你的回合 (白棋)");
        } else {
            turnLabel.innerText = (currentTurn === 1 ? "⚫ 对方落子..." : "⚪ 对方落子...");
        }
    }

    function syncFromData(data) {
        if(!data || !data.board) return;
        const newBoard = data.board;
        for(let i=0;i<boardSize;i++)
            for(let j=0;j<boardSize;j++)
                board[i][j] = newBoard[i][j] || 0;
        redrawAll();
        if(data.currentTurn !== undefined) currentTurn = data.currentTurn;
        if(data.gameOver !== undefined) gameOver = data.gameOver;
        if(data.winner !== undefined) winner = data.winner;
        updateUI();

        if(!gameOver && myColor !== null) {
            if(currentTurn === myColor) statusMsgDiv.innerText = "轮到你了，点击落子";
            else statusMsgDiv.innerText = "等待对方落子...";
        } else if(gameOver) {
            if(winner === 1) statusMsgDiv.innerText = "游戏结束，黑棋获胜！点击新一局";
            else if(winner === 2) statusMsgDiv.innerText = "游戏结束，白棋获胜！点击新一局";
            else statusMsgDiv.innerText = "平局！点击新一局";
        }
    }

    function placePiece(row, col) {
        if(gameOver) { statusMsgDiv.innerText = "游戏已结束，请按「新一局」"; return false; }
        if(myColor === null) { statusMsgDiv.innerText = "等待对手加入..."; return false; }
        if(currentTurn !== myColor) { statusMsgDiv.innerText = "请等待对方落子"; return false; }
        if(board[row][col] !== 0) return false;

        board[row][col] = myColor;
        drawPiece(row, col);
        const win = checkWin(row, col, myColor);
        const full = isFull();
        let gameEnd = false, winColor = null;
        if(win) { gameEnd = true; winColor = myColor; }
        else if(full) { gameEnd = true; winColor = 0; }

        const nextTurn = (myColor === 1 ? 2 : 1);
        const boardCopy = board.map(r => [...r]);
        roomRef.update({
            board: boardCopy,
            currentTurn: nextTurn,
            gameOver: gameEnd,
            winner: winColor
        }).catch(err => console.error(err));
        return true;
    }

    function resetGame() {
        if(!roomRef) return;
        const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
        roomRef.update({
            board: emptyBoard,
            currentTurn: 1,
            gameOver: false,
            winner: null
        }).catch(err => console.error(err));
    }

    // 监听房间数据
    function startListening() {
        roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) syncFromData(data);
        });
    }

    // 清理占位（页面关闭/刷新时自动删除）
    function setupPresence() {
        if (!playerRef) return;
        playerRef.onDisconnect().remove((error) => {
            if (error) console.error("onDisconnect error:", error);
        });
        // 页面关闭前也尝试删除（但 onDisconnect 已经足够）
        window.addEventListener('beforeunload', () => {
            if (playerRef) playerRef.remove();
        });
    }

    // 初始化房间及玩家分配（基于原子化占位）
    async function initRoom() {
        const params = new URLSearchParams(window.location.search);
        let room = params.get('room');
        if(!room) {
            room = Math.random().toString(36).substring(2, 8);
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${room}`;
            window.history.replaceState({}, '', newUrl);
        }
        roomId = room;
        roomInfoDiv.innerHTML = `🏠 房间号: <strong>${roomId}</strong> <span style="font-size:12px;">(分享链接给朋友)</span><br>🔗 <a href="#" id="copyLink">复制链接</a>`;
        document.getElementById('copyLink')?.addEventListener('click', (e) => {
            e.preventDefault();
            const fullUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(fullUrl);
            statusMsgDiv.innerText = "链接已复制，发给朋友吧！";
        });

        roomRef = database.ref(`games/${roomId}`);
        myPlayerId = Date.now() + '-' + Math.random().toString(36);
        
        // 尝试先获取房间当前玩家信息
        const snapshot = await roomRef.once('value');
        let currentData = snapshot.val();
        
        if (!currentData) {
            // 房间不存在，创建者执黑
            const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const init = {
                board: emptyBoard,
                currentTurn: 1,
                gameOver: false,
                winner: null,
                blackId: myPlayerId,   // 黑棋占位
                whiteId: null
            };
            await roomRef.set(init);
            myColor = 1;
            statusMsgDiv.innerText = "你是黑棋 (先手)，等待白棋加入...";
            turnLabel.innerText = "等待对手加入";
            // 监听 blackId 变化（实际上 whiteId 设置后对手出现）
            startListening();
            // 设置自己占位清理
            playerRef = roomRef.child('blackId');
            setupPresence();
        } else {
            // 房间已存在
            if (currentData.blackId && !currentData.whiteId) {
                // 黑棋已有，尝试成为白棋
                // 为防止并发，使用 transaction 来设置 whiteId（只有为空时才能设置）
                const whiteResult = await roomRef.child('whiteId').transaction((current) => {
                    if (current === null) return myPlayerId;
                    else return; // 已被占用，中止
                });
                if (whiteResult.committed) {
                    myColor = 2;
                    statusMsgDiv.innerText = "你是白棋 (后手)，等待黑棋落子...";
                    turnLabel.innerText = "白棋后手";
                    startListening();
                    playerRef = roomRef.child('whiteId');
                    setupPresence();
                } else {
                    // 白棋已被其他人抢占了（并发），或者房间已满
                    statusMsgDiv.innerText = "房间已满，无法加入";
                    turnLabel.innerText = "房间已满";
                    return;
                }
            } else if (currentData.blackId && currentData.whiteId) {
                statusMsgDiv.innerText = "房间已满，无法加入";
                turnLabel.innerText = "房间已满";
                return;
            } else {
                // 理论上 blackId 应该存在，若不存在（异常）则重置为黑棋
                // 这里做容错：如果 blackId 为空，则尝试设置黑棋
                const blackResult = await roomRef.child('blackId').transaction((current) => {
                    if (current === null) return myPlayerId;
                    else return;
                });
                if (blackResult.committed) {
                    // 初始棋盘也需要设置
                    const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
                    await roomRef.update({
                        board: emptyBoard,
                        currentTurn: 1,
                        gameOver: false,
                        winner: null
                    });
                    myColor = 1;
                    statusMsgDiv.innerText = "你是黑棋 (先手)，等待白棋加入...";
                    turnLabel.innerText = "等待对手加入";
                    startListening();
                    playerRef = roomRef.child('blackId');
                    setupPresence();
                } else {
                    statusMsgDiv.innerText = "房间状态异常，请刷新重试";
                }
            }
        }
    }

    // 鼠标交互
    function getNearestGrid(mouseX, mouseY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const canvasX = (mouseX - rect.left) * scaleX;
        const canvasY = (mouseY - rect.top) * scaleY;
        let col = Math.round(canvasX / cellSize);
        let row = Math.round(canvasY / cellSize);
        col = Math.min(Math.max(0, col), boardSize-1);
        row = Math.min(Math.max(0, row), boardSize-1);
        const exactX = col * cellSize, exactY = row * cellSize;
        if (Math.hypot(canvasX - exactX, canvasY - exactY) > cellSize * 0.45) return null;
        return {row, col};
    }

    canvas.addEventListener('click', (e) => {
        if (gameOver) { statusMsgDiv.innerText = "游戏已结束，按新一局继续"; return; }
        const grid = getNearestGrid(e.clientX, e.clientY);
        if (grid) placePiece(grid.row, grid.col);
    });
    resetBtn.addEventListener('click', () => resetGame());

    drawBoard();
    initRoom();
</script>
</body>
</html>
